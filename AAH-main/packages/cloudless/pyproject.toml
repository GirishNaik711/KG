[project]
name = "cloudless"
version = "0.0.1"
description = "Cloud-agnostic agentic AI framework: write your agent once, ship it to any cloud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "cloudless contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Runtime essentials (no cloud SDKs in core; adapters bring them in)
    "pydantic>=2.7.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0.0",
    "typing-extensions>=4.10.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Framework adapters — see Q5 framework rollout
langgraph = [
    "langgraph>=0.2,<2.0",
    "langchain>=0.3,<2.0",
    "langchain-core>=0.3,<2.0",
    "langchain-aws>=0.2,<2.0",
]
strands = [
    "strands-agents>=1.39.0",
    # Pinned to A2A spec v0.3 lane per SPIKE-FINDINGS.md F3
    "a2a-sdk>=0.3.9,<1.0.0",
    "fastapi>=0.115.0",
]
adk = [
    "google-adk>=1.30.0",
]
claude_sdk = [
    "claude-agent-sdk>=0.1.0",
]
maf = [
    "agent-framework>=0.1.0",
]
# Cloud adapters
aws = [
    "boto3>=1.40.0",
    "bedrock-agentcore>=1.9.0",
    "bedrock-agentcore-starter-toolkit>=0.3.0",
]
gcp = [
    "google-cloud-aiplatform[agent-engines]>=1.80.0",
    "google-genai>=0.10.0",
    "google-cloud-storage>=2.18.0",
    "cloudpickle>=3.0.0",
]
# Dev tools
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]
all = [
    "cloudless[langgraph,strands,adk,claude_sdk,maf,aws,gcp,dev]",
]

[project.scripts]
cloudless = "cloudless.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudless"]

[tool.hatch.build.targets.wheel.force-include]
"src/cloudless/py.typed" = "cloudless/py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires real AWS or GCP credentials; not run by default in CI fast lane",
    "perf: latency benchmark; not run by default; report p50/p95 instead of pass/fail",
]
addopts = "-m 'not integration and not perf'"

[tool.mypy]
# Strict over the public surface. Adapters + CLI internals are excluded —
# they handle dynamic cloud SDK shapes and would force pervasive `# type: ignore`
# without real safety gain.
strict = true
warn_unused_ignores = true
warn_return_any = false   # cloud SDKs leak Any through their return types
ignore_missing_imports = true
disallow_any_generics = false  # bare `dict`/`list`/`Callable` are common and fine
disable_error_code = [
    "import-untyped",
    "import-not-found",
    "no-untyped-def",       # arg/return annotations not enforced
    "no-any-return",
    "type-arg",              # bare generics
]
exclude = [
    "src/cloudless/adapters/",
    "src/cloudless/cli/",
    "src/cloudless/eval/",
    "src/cloudless/testing/",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "RUF001", # ambiguous unicode in strings (we use × and – intentionally for typography)
    "RUF002", # same — ambiguous unicode in docstrings
    "RUF003", # same — ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
# Test files use descriptive names like test_Chunk_union or AWS-mirroring
# fixture kwargs like memoryId / gatewayIdentifier — both legitimate uses
# of identifiers that don't conform to PEP-8 naming rules.
"tests/**/*.py" = ["N802", "N803", "N806", "N812", "N818"]
# The exception hierarchy uses domain-meaningful names (CostCapExceeded,
# GuardrailBlocked) rather than ErrorSuffix — public API, can't rename.
"src/cloudless/exceptions.py" = ["N818"]
"src/cloudless/runtime/identity.py" = ["N818"]

