[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codemap-scale"
version = "0.1.0"
description = "Persistent code intelligence for AI agents — scaled to 500K+ files"
requires-python = ">=3.9"
dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "xxhash>=3.4",
    "gitignore-parser>=0.1.11",
    "click>=8.0",
]

[project.optional-dependencies]
rust = ["maturin>=1.5"]
codemap = ["codemap>=0.1.0"]
embeddings-local = ["sentence-transformers>=2.5", "chromadb>=0.5.0"]
community = ["networkx>=3.2", "graspologic>=3.3"]
community-light = ["networkx>=3.2"]
dev = ["pytest>=8.0", "pytest-benchmark>=4.0", "psutil>=5.9", "ruff>=0.3", "networkx>=3.2"]

[project.scripts]
codemap = "codemap_scale.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that clone real repos or do full indexing (deselect with '-m not slow')",
    "benchmark: marks benchmark tests",
]
