[package]
name = "codemap-rs"
version = "0.1.0"
edition = "2021"
description = "High-performance core for CodeMap: parallel file walking, hashing, and tree-sitter parsing"

[lib]
name = "codemap_rs"
crate-type = ["cdylib"]

[dependencies]
# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }

# Parallelism
rayon = "1.10"

# File walking (respects .gitignore natively)
ignore = "0.4"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Tree-sitter parsing (native Rust — no FFI overhead)
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
bytecount = "0.6"
num_cpus = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
