# api-schema.yaml — Template
# Canonical OpenAPI 3.1.0 contract for ONE module. Single source of truth for
# every request / response shape exchanged between frontend and backend for that
# module, so FE and BE code resolve to the same named types.
#
# Copied per module into: .aah/architecture/schema/MOD-NNN-api-schema.yaml
# Written by:  /aah-arch Step 5 (one file per API-exposing module in module-map.yaml)
# Consumed by: /aah-plan (feature decomposition), aah-arch-review-board,
#              validate_api_schema gate
# Ownership:   the filename carries the module id — every operation inside a
#              MOD-NNN-api-schema.yaml file is owned by MOD-NNN. No x-aah-module
#              field needed.

openapi: 3.1.0                                     # OpenAPI spec version — pin to 3.1.0

info:                                              # API-level metadata (REQUIRED)
  title: "Project API"                             # human-readable API name — e.g. "Customer Portal — Orders (MOD-002)"
  version: "1.0.0"                                 # your API's semver — e.g. "2.3.0"
  description: |                                   # free-text overview shown in docs
    Canonical API contract. Generated by /aah-arch, consumed by /aah-plan.

paths:                                             # every URL the API exposes
  "/example":                                      # one URL path — e.g. /orders, /users/{user_id}/orders
    parameters:                                    # optional — params shared by every method on this path
      - name: "example_id"                         # param name — e.g. "order_id"
        in: "path"                                 # where it lives — path | query | header | cookie
        required: true                             # MUST be true when in: path
        schema:
          type: "string"                           # param primitive type — string | integer | number | boolean
    get:                                           # HTTP method — get | put | post | delete | patch | options | head | trace
      operationId: "example_operation"             # stable unique id used everywhere downstream — e.g. "create_order"
      summary: "One-line summary of what this operation does."
      requestBody:                                 # include ONLY for methods that carry a body (post / put / patch)
        required: true                             # is the body mandatory
        content:
          "application/json":                      # media type — application/json | multipart/form-data | text/event-stream
            schema:
              $ref: "#/components/schemas/ExampleRequest"   # named request schema (defined below)
      responses:                                   # every status code this op can return (REQUIRED — >=1 entry)
        "200":                                     # HTTP status — explicit ("201") or wildcard ("2XX", "default")
          description: "Success."                  # short human description (REQUIRED per spec)
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ExampleResponse"

components:                                        # reusable definitions referenced by $ref

  schemas:                                         # every named payload/response shape lives here
    ExampleRequest:                                # PascalCase schema name — e.g. "CreateOrderRequest"
      type: object                                 # top-level shape kind — usually "object"
      required: []                                 # field names the client MUST send — e.g. ["customer_id", "items"]
      properties: {}                               # typed field definitions (see ErrorResponse below for the shape)

    ExampleResponse:                               # PascalCase schema name — e.g. "CreateOrderResponse"
      type: object
      required: []
      properties: {}

# ── RULES ──
# - One file per module. Filename `MOD-NNN-api-schema.yaml` carries ownership; no x-aah-module field.
# - Every request / response body MUST `$ref` into components.schemas — no inline shapes.
# - Every operation MUST declare `operationId` (stable, snake_case, unique across ALL module files).
# - Every Response Object MUST have a `description`. Path params MUST have `required: true` + `schema`.
# - One shape, one definition: if DB and API projection differ, define both here (e.g. Order + OrderPublic).
# - Every wireframe `data dependency` (applications_wireframes/) MUST resolve to an operationId in some module's file.
